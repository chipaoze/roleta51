<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prévia · Cursor Dragão de Brasa</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 15%,#39210e,#101422 52%,#06080e);color:#fff;font:16px/1.45 system-ui,sans-serif;cursor:none}main{position:relative;z-index:2;width:min(760px,calc(100% - 48px));margin:8vh auto;padding:32px;border:1px solid #b85d22;border-radius:24px;background:#0c1221dc;box-shadow:0 26px 80px #0009}small{color:#f29a4b;font-weight:900;letter-spacing:.12em}h1{margin:8px 0;font-size:clamp(28px,5vw,52px)}p{max-width:590px;color:#c8d2de}.test-zone{height:260px;margin-top:24px;border:1px dashed #e87827;border-radius:16px;background:linear-gradient(135deg,#1a0d09,#121b2b);display:grid;place-items:center;text-align:center}.test-zone strong{font-size:21px}.test-zone span{display:block;margin-top:8px;color:#f4b55e}.hotkey{display:inline-grid;place-items:center;min-width:32px;margin:0 4px;padding:2px 7px;border:1px solid #ffba63;border-radius:7px;background:#35160d;color:#ffe1a6;font:bold 14px ui-monospace,monospace}.dragon-cursor{position:fixed;z-index:10;left:0;top:0;width:72px;height:72px;object-fit:contain;pointer-events:none;transform:translate(-10px,-12px);filter:drop-shadow(0 5px 7px #000)}.ember{position:fixed;z-index:1;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle,#fff6aa 0 12%,#ffb12c 26%,#eb3f12 58%,transparent 70%);pointer-events:none;mix-blend-mode:screen;animation:ember .9s ease-out forwards}@keyframes ember{to{transform:translate(var(--x),var(--y)) scale(.08);opacity:0}}.fire-trail{position:fixed;z-index:1;width:42px;height:18px;border-radius:99px;background:linear-gradient(90deg,transparent,#e94311 28%,#ffb12c 60%,#fff0a0);filter:blur(2px) drop-shadow(0 0 8px #ff561c);pointer-events:none;transform-origin:right center;animation:trail .5s ease-out forwards}@keyframes trail{to{transform:scaleX(.15) scaleY(.3);opacity:0}}.flame-puff{position:fixed;z-index:7;width:var(--size);height:calc(var(--size) * .72);border-radius:55% 45% 50% 50%;background:radial-gradient(ellipse at 72% 50%,#fff9b0 0 8%,#ffd13c 18%,#ff7018 43%,#e72c0f 66%,transparent 74%);filter:blur(.4px) drop-shadow(0 0 10px #ff5a16);pointer-events:none;transform-origin:right center;animation:flame-puff .55s ease-out forwards}@keyframes flame-puff{to{transform:translate(var(--fx),var(--fy)) rotate(var(--spin)) scale(.22);opacity:0}}.fire-canvas{position:fixed;z-index:7;pointer-events:none;mix-blend-mode:screen;filter:drop-shadow(0 0 11px #ff4a10)}
  </style>
</head>
<body>
  <main><small>PRÉVIA INTERATIVA · ITEM DA LOJA</small><h1>Cursor Dragão de Brasa</h1><p>Movimente o mouse para testar o dragão e seu rastro de fogo. Pressione <kbd class="hotkey">F</kbd> para o dragão soprar fogo na direção do cursor.</p><section class="test-zone"><div><strong>Área segura para navegação</strong><span>O dragão não bloqueia cliques nem controles.</span></div></section></main>
  <img class="dragon-cursor" src="/cursor-dragon-fire.png" alt="">
  <script>
    const dragon=document.querySelector('.dragon-cursor');let x=innerWidth/2,y=innerHeight/2,lastX=x,lastY=y;
    let flameRange=130,stream,fireFrame=0;
    const breath=()=>{if(!stream){stream=document.createElement('canvas');stream.className='fire-canvas';document.body.append(stream)}const width=flameRange+35,height=140;stream.width=width*devicePixelRatio;stream.height=height*devicePixelRatio;stream.style.width=width+'px';stream.style.height=height+'px';stream.style.left=(x-16-flameRange)+'px';stream.style.top=(y-66)+'px'};
    const drawTongue=(c,w,h,t,index,scale,color,alpha)=>{const startX=w-10,startY=h/2+(index-3)*4;const len=flameRange*(.52+((index%4)*.11))*scale;const tipX=startX-len;const sway=Math.sin(t*2.6+index*2.1)*18+(index-3)*5;const width=(23-(index%3)*3)*scale;c.save();c.globalAlpha=alpha;c.beginPath();c.moveTo(startX,startY-width*.55);c.bezierCurveTo(startX-len*.2,startY-width*1.05+sway,startX-len*.54,startY-width*.8+sway,tipX,startY+sway);c.bezierCurveTo(startX-len*.48,startY+width*.85+sway,startX-len*.16,startY+width*.7+sway,startX,startY+width*.55);c.closePath();const g=c.createLinearGradient(startX,startY,tipX,startY+sway);g.addColorStop(0,color[0]);g.addColorStop(.35,color[1]);g.addColorStop(1,color[2]);c.fillStyle=g;c.filter='blur('+Math.max(.4,2.4-scale*1.4)+'px)';c.fill();c.restore()};
    const drawFire=()=>{if(!stream)return;const c=stream.getContext('2d'),w=stream.width/devicePixelRatio,h=stream.height/devicePixelRatio,t=performance.now()/120;c.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);c.clearRect(0,0,w,h);c.globalCompositeOperation='lighter';for(let i=0;i<9;i++)drawTongue(c,w,h,t,i,1,['rgba(205,24,5,.1)','rgba(245,57,9,.9)','rgba(255,128,18,0)'],.95);for(let i=0;i<7;i++)drawTongue(c,w,h,t+.6,i,0.72,['rgba(255,92,7,.15)','rgba(255,150,20,.95)','rgba(255,214,73,0)'],.95);for(let i=0;i<5;i++)drawTongue(c,w,h,t+1.2,i,0.43,['rgba(255,173,25,.15)','rgba(255,235,119,.98)','rgba(255,249,199,0)'],.95);c.globalCompositeOperation='source-over';fireFrame=requestAnimationFrame(drawFire)};
    const fireball=()=>{for(let i=0;i<9;i++){const flame=document.createElement('i');flame.className='flame-puff';const size=28+Math.random()*18;flame.style.left=(x-16)+'px';flame.style.top=(y-10+Math.random()*20)+'px';flame.style.setProperty('--size',size+'px');flame.style.setProperty('--fx',(-190-Math.random()*70)+'px');flame.style.setProperty('--fy',(-18+Math.random()*36)+'px');flame.style.setProperty('--spin',(-12+Math.random()*24)+'deg');document.body.append(flame);setTimeout(()=>flame.remove(),600)}};
    addEventListener('pointermove',event=>{x=event.clientX;y=event.clientY;const angle=Math.atan2(y-lastY,x-lastX)*180/Math.PI;dragon.style.transform=`translate(${x-13}px,${y-15}px)`;if(stream)breath();const trail=document.createElement('i');trail.className='fire-trail';trail.style.left=(x-10)+'px';trail.style.top=(y+12)+'px';trail.style.transform=`rotate(${angle+180}deg)`;document.body.append(trail);setTimeout(()=>trail.remove(),540);if(Math.random()<.85){const ember=document.createElement('i');ember.className='ember';ember.style.left=(x-5)+'px';ember.style.top=(y+18)+'px';ember.style.setProperty('--x',(-46+Math.random()*92)+'px');ember.style.setProperty('--y',(14+Math.random()*48)+'px');document.body.append(ember);setTimeout(()=>ember.remove(),950)}lastX=x;lastY=y});
    let fireLoop=0,fireStart=0,fireHeld=false;
    addEventListener('keydown',event=>{if(event.key.toLowerCase()!=='f'||fireStart)return;event.preventDefault();fireStart=Date.now();fireHeld=false;setTimeout(()=>{if(!fireStart)return;fireHeld=true;flameRange=130;breath();drawFire();fireLoop=setInterval(()=>{flameRange=Math.min(390,flameRange+42);breath()},260)},190)});
    const stopBreath=()=>{cancelAnimationFrame(fireFrame);stream?.remove();stream=null};
    addEventListener('keyup',event=>{if(event.key.toLowerCase()!=='f'||!fireStart)return;clearInterval(fireLoop);if(!fireHeld)fireball();stopBreath();fireLoop=0;fireStart=0;fireHeld=false});
    addEventListener('blur',()=>{clearInterval(fireLoop);stopBreath();fireLoop=0;fireStart=0;fireHeld=false});
  </script>
</body>
</html>
